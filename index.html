<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HOYA DÉPOT SEARCH - Gestion & Recherche de Verres</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hoyaBlue: '#38BDF8',
            hoyaYellow: '#FBBF24',
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.97); }
    }
    .animate-pulse-fast {
      animation: pulse-fast 0.6s ease-in-out infinite;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div id="root" class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[750px] sm:max-h-[900px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-700/50"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Configuration
    const SUPABASE_URL = "https://wgkitgnuqfdvjgbjiqzi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indna2l0Z251cWZkdmpnYmppcXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODUyNTcsImV4cCI6MjEwODk2MTI1N30.hX4b1tuNPAcAMjTyEdi11a3p8LEw4KHYzWrPpkXEUAM";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial fallback data
    const initialArticles = [
      "HOYA Hilux 1.50 Hard",
      "HOYA Hilux 1.50 HVA",
      "HOYA Nulux 1.60 HVLL",
      "HOYA Nulux 1.67 BlueControl",
      "HOYA Maxxee 1.56 HMC"
    ];

    const initialCyls = ["0.00", "0.25", "0.50", "0.75", "1.00", "1.25", "1.50", "1.75", "2.00"];

    const initialNegSpheres = ["-0.25", "-0.50", "-0.75", "-1.00", "-1.25", "-1.50", "-1.75", "-2.00", "-2.25", "-2.50", "-3.00", "-3.50", "-4.00"];
    const initialPosSpheres = ["+0.25", "+0.50", "+0.75", "+1.00", "+1.25", "+1.50", "+1.75", "+2.00", "+2.25", "+2.50", "+3.00", "+3.50", "+4.00"];

    const initialResults = [
      {
        id: "1",
        article: "HOYA Hilux 1.50 Hard",
        cyl: "0.00",
        sphere: "-0.75",
        result_text: "DÉPOT HOYA: Rangée B-04 / Casier 12 - Disponible 8 pièces prêtes pour livraison immédiate",
        notes: "Stock disponible en réserve centrale"
      },
      {
        id: "2",
        article: "HOYA Hilux 1.50 Hard",
        cyl: "0.50",
        sphere: "-0.75",
        result_text: "DÉPOT HOYA: Rangée B-04 / Casier 15 - Disponible 3 pièces",
        notes: "Quantité faible"
      },
      {
        id: "3",
        article: "HOYA Nulux 1.60 HVLL",
        cyl: "0.00",
        sphere: "+1.00",
        result_text: "DÉPOT HOYA: Rayon Principal A-01 / Armoire Verres Précision - Disponible 14 pièces",
        notes: "Traitement haute protection HVLL"
      },
      {
        id: "4",
        article: "HOYA Nulux 1.67 BlueControl",
        cyl: "0.00",
        sphere: "-1.50",
        result_text: "DÉPOT HOYA: Section Spéciale C-02 / Tiroir 8 - Disponible 6 pièces",
        notes: "Verre BlueControl certifié"
      }
    ];

    function App() {
      const [view, setView] = useState('search'); // 'search' | 'settings'

      // Data states
      const [articles, setArticles] = useState(initialArticles);
      const [cyls, setCyls] = useState(initialCyls);
      const [negSpheres, setNegSpheres] = useState(initialNegSpheres);
      const [posSpheres, setPosSpheres] = useState(initialPosSpheres);
      const [results, setResults] = useState(initialResults);
      const [loading, setLoading] = useState(false);

      // Search screen selections
      const [selectedArticle, setSelectedArticle] = useState(initialArticles[0] || '');
      const [selectedCyl, setSelectedCyl] = useState('');
      const [selectedSphere, setSelectedSphere] = useState('');
      const [sphereSignTab, setSphereSignTab] = useState('-'); // '-' | '+'

      // Modal states
      const [modalArticleOpen, setModalArticleOpen] = useState(false);
      const [modalCylOpen, setModalCylOpen] = useState(false);
      const [modalSphereOpen, setModalSphereOpen] = useState(false);

      // Search execution state
      const [isSearching, setIsSearching] = useState(false);
      const [searchDone, setSearchDone] = useState(false);
      const [currentMatch, setCurrentMatch] = useState(null);

      // Settings screen state
      const [settingsTab, setSettingsTab] = useState('options'); // 'options' | 'results'
      const [selectedCriteria, setSelectedCriteria] = useState('article'); // 'article' | 'cyl' | 'sphere_minus' | 'sphere_plus'
      const [newOptionInput, setNewOptionInput] = useState('');
      const [editingItem, setEditingItem] = useState(null);
      const [toast, setToast] = useState(null);

      // Mapping Form state
      const [mapArticle, setMapArticle] = useState('');
      const [mapCyl, setMapCyl] = useState('');
      const [mapSphereSign, setMapSphereSign] = useState('-');
      const [mapSphere, setMapSphere] = useState('');
      const [mapResultText, setMapResultText] = useState('');
      const [mapNotes, setMapNotes] = useState('');

      const showToast = (text, type = 'success') => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Load data from Supabase
      const fetchData = async () => {
        try {
          setLoading(true);
          const { data: opts, error: optErr } = await supabase.from('filter_options').select('*');
          if (opts && opts.length > 0) {
            setArticles(opts.filter(o => o.category === 'article').map(o => o.value));
            setCyls(opts.filter(o => o.category === 'cyl').map(o => o.value));
            setNegSpheres(opts.filter(o => o.category === 'sphere' && o.sphere_sign === '-').map(o => o.value));
            setPosSpheres(opts.filter(o => o.category === 'sphere' && o.sphere_sign === '+').map(o => o.value));
          }

          const { data: res, error: resErr } = await supabase.from('search_results').select('*');
          if (res && res.length > 0) {
            setResults(res);
          }
        } catch (err) {
          console.warn('Utilisation des données locales initiales:', err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();

        // Subscribe to Supabase Realtime
        const channel = supabase.channel('web_optical_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'filter_options' }, fetchData)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'search_results' }, fetchData)
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      // Execute search with exact 2-second animation
      const handleSearch = () => {
        if (!selectedArticle || !selectedCyl || !selectedSphere) return;

        setIsSearching(true);
        setSearchDone(false);

        setTimeout(() => {
          const match = results.find(r => 
            r.article.trim().toLowerCase() === selectedArticle.trim().toLowerCase() &&
            r.cyl.trim() === selectedCyl.trim() &&
            r.sphere.trim() === selectedSphere.trim()
          );

          setCurrentMatch(match || null);
          setIsSearching(false);
          setSearchDone(true);
        }, 2000);
      };

      const handleReset = () => {
        setSelectedCyl('');
        setSelectedSphere('');
        setSearchDone(false);
        setCurrentMatch(null);
      };

      // Settings management
      const getCurrentList = () => {
        if (selectedCriteria === 'article') return articles;
        if (selectedCriteria === 'cyl') return cyls;
        if (selectedCriteria === 'sphere_minus') return negSpheres;
        return posSpheres;
      };

      const handleAddOption = async () => {
        if (!newOptionInput.trim()) return;
        let val = newOptionInput.trim();
        let cat = 'article';
        let sign = null;

        if (selectedCriteria === 'cyl') cat = 'cyl';
        else if (selectedCriteria === 'sphere_minus') {
          cat = 'sphere';
          sign = '-';
          if (!val.startsWith('-')) val = `-${val}`;
        } else if (selectedCriteria === 'sphere_plus') {
          cat = 'sphere';
          sign = '+';
          if (!val.startsWith('+')) val = `+${val}`;
        }

        try {
          await supabase.from('filter_options').insert([{ category: cat, value: val, sphere_sign: sign }]);
          showToast('Option ajoutée et synchronisée');
        } catch (e) {
          console.log(e);
        }

        // Local state update
        if (selectedCriteria === 'article') setArticles(prev => [...prev, val]);
        else if (selectedCriteria === 'cyl') setCyls(prev => [...prev, val]);
        else if (selectedCriteria === 'sphere_minus') setNegSpheres(prev => [...prev, val]);
        else setPosSpheres(prev => [...prev, val]);

        setNewOptionInput('');
      };

      const handleDeleteOption = async (val) => {
        try {
          await supabase.from('filter_options').delete().eq('value', val);
          showToast(`Option (${val}) supprimée`);
        } catch (e) {}

        if (selectedCriteria === 'article') setArticles(prev => prev.filter(x => x !== val));
        else if (selectedCriteria === 'cyl') setCyls(prev => prev.filter(x => x !== val));
        else if (selectedCriteria === 'sphere_minus') setNegSpheres(prev => prev.filter(x => x !== val));
        else setPosSpheres(prev => prev.filter(x => x !== val));
      };

      const handleSaveResult = async () => {
        if (!mapArticle || !mapCyl || !mapSphere || !mapResultText.trim()) {
          showToast('Veuillez remplir tous les critères', 'error');
          return;
        }

        const newEntry = {
          article: mapArticle,
          cyl: mapCyl,
          sphere: mapSphere,
          result_text: mapResultText.trim(),
          notes: mapNotes.trim() || null
        };

        try {
          await supabase.from('search_results').upsert(newEntry, { onConflict: 'article,cyl,sphere' });
          showToast('Résultat enregistré dans le dépôt');
        } catch (e) {}

        setResults(prev => {
          const filtered = prev.filter(r => !(r.article === mapArticle && r.cyl === mapCyl && r.sphere === mapSphere));
          return [newEntry, ...filtered];
        });

        setMapResultText('');
        setMapNotes('');
      };

      const handleDeleteResult = async (res) => {
        try {
          if (res.id) await supabase.from('search_results').delete().eq('id', res.id);
          else await supabase.from('search_results').delete().eq('article', res.article).eq('cyl', res.cyl).eq('sphere', res.sphere);
          showToast('Résultat supprimé');
        } catch (e) {}

        setResults(prev => prev.filter(r => !(r.article === res.article && r.cyl === res.cyl && r.sphere === res.sphere)));
      };

      const allSelected = selectedArticle && selectedCyl && selectedSphere;

      return (
        <div className="flex-1 flex flex-col h-full bg-slate-50 overflow-hidden">
          
          {/* HEADER */}
          <div className="bg-slate-900 pt-7 pb-4 px-5 shadow-sm flex items-center justify-between text-white flex-shrink-0">
            <div className="flex items-center space-x-1.5">
              <span className="text-xl font-black tracking-wider text-hoyaBlue">HOYA DÉPOT </span>
              <span className="text-xl font-black tracking-wider text-hoyaYellow">SEARCH</span>
            </div>
            
            <button
              onClick={() => setView(view === 'search' ? 'settings' : 'search')}
              className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-hoyaBlue hover:bg-slate-700 transition"
              title="Paramètres"
            >
              {view === 'search' ? (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              ) : (
                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
              )}
            </button>
          </div>

          {/* Toast Notification */}
          {toast && (
            <div className={`mx-4 mt-3 p-3 rounded-xl text-white text-xs font-bold flex items-center shadow-lg transition ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
              <span>{toast.text}</span>
            </div>
          )}

          {/* VIEW 1: SEARCH SCREEN */}
          {view === 'search' ? (
            <div className="flex-1 overflow-y-auto p-4 space-y-3.5">
              
              {/* Criterion 1: Article */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center space-x-2">
                    <span className="w-5 h-5 rounded bg-sky-100 text-sky-700 text-xs font-bold flex items-center justify-center">1</span>
                    <span className="text-sm font-bold text-slate-800">Article</span>
                  </div>
                  <span className="text-xs text-slate-400">{articles.length} dispos</span>
                </div>
                <button
                  onClick={() => setModalArticleOpen(true)}
                  className="w-full flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-left hover:bg-slate-100 transition"
                >
                  <span className={`text-sm font-semibold truncate ${selectedArticle ? 'text-slate-900' : 'text-slate-400'}`}>
                    {selectedArticle || 'Sélectionner un article...'}
                  </span>
                  <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
              </div>

              {/* Criterion 2: Cyl */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center space-x-2">
                    <span className="w-5 h-5 rounded bg-sky-100 text-sky-700 text-xs font-bold flex items-center justify-center">2</span>
                    <span className="text-sm font-bold text-slate-800">Cylindre (Cyl)</span>
                  </div>
                  {selectedCyl ? (
                    <span className="text-xs font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-200">Choisi: {selectedCyl}</span>
                  ) : (
                    <span className="text-xs text-amber-600 font-medium">Requis</span>
                  )}
                </div>
                <button
                  onClick={() => setModalCylOpen(true)}
                  className="w-full flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-left hover:bg-slate-100 transition"
                >
                  <span className={`text-sm font-semibold truncate ${selectedCyl ? 'text-slate-900 font-bold' : 'text-slate-400'}`}>
                    {selectedCyl ? `Cyl: ${selectedCyl}` : 'Sélectionner la valeur Cyl...'}
                  </span>
                  <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
              </div>

              {/* Criterion 3: Sphère */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center space-x-2">
                    <span className="w-5 h-5 rounded bg-sky-100 text-sky-700 text-xs font-bold flex items-center justify-center">3</span>
                    <span className="text-sm font-bold text-slate-800">Sphère</span>
                  </div>
                  {selectedSphere ? (
                    <span className={`text-xs font-bold px-2 py-0.5 rounded border ${selectedSphere.startsWith('+') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-indigo-50 text-indigo-700 border-indigo-200'}`}>
                      Choisi: {selectedSphere}
                    </span>
                  ) : (
                    <span className="text-xs text-amber-600 font-medium">Requis (+ ou -)</span>
                  )}
                </div>
                <button
                  onClick={() => setModalSphereOpen(true)}
                  className="w-full flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-left hover:bg-slate-100 transition"
                >
                  <span className={`text-sm font-semibold truncate ${selectedSphere ? 'text-slate-900 font-bold' : 'text-slate-400'}`}>
                    {selectedSphere ? `Sphère: ${selectedSphere}` : 'Sélectionner la valeur Sphère (+ ou -)...'}
                  </span>
                  <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
              </div>

              {/* Summary Tag */}
              {allSelected && (
                <div className="bg-sky-50 border border-sky-200 rounded-xl p-3 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-800 truncate mr-2">
                    {selectedArticle} | Cyl: {selectedCyl} | Sphère: {selectedSphere}
                  </span>
                  <button onClick={handleReset} className="text-xs bg-white border border-slate-200 px-2 py-1 rounded text-slate-600 hover:bg-slate-50">
                    Effacer
                  </button>
                </div>
              )}

              {/* SEARCH BUTTON (Exact 2-second animated state) */}
              <div className="pt-1">
                <button
                  disabled={!allSelected || isSearching}
                  onClick={handleSearch}
                  className={`w-full py-4 rounded-2xl font-black text-white text-base flex items-center justify-center space-x-2 shadow-lg transition transform ${
                    !allSelected 
                      ? 'bg-slate-300 cursor-not-allowed opacity-80' 
                      : isSearching 
                      ? 'bg-amber-500 animate-pulse-fast shadow-amber-500/20' 
                      : 'bg-sky-600 hover:bg-sky-700 active:scale-98 shadow-sky-600/30'
                  }`}
                >
                  {isSearching ? (
                    <>
                      <svg className="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                      <span>Recherche en cours dans le dépôt... (2s)</span>
                    </>
                  ) : (
                    <>
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                      <span>{allSelected ? 'Rechercher dans le stock' : 'Sélectionner les 3 critères'}</span>
                    </>
                  )}
                </button>
              </div>

              {/* RESULT DISPLAY */}
              {searchDone && (
                <div className="pt-2 transition-all">
                  {currentMatch ? (
                    <div className="bg-white rounded-2xl p-5 border-2 border-emerald-500 shadow-xl">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                        <div className="flex items-center space-x-2">
                          <span className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">✓</span>
                          <span className="font-bold text-slate-900 text-sm">Résultat correspondant</span>
                        </div>
                        <span className="bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-200">
                          Emplacement stock
                        </span>
                      </div>

                      <div className="my-4 p-4 bg-slate-900 rounded-xl">
                        <div className="text-xs text-sky-400 font-semibold mb-1">Résultat direct :</div>
                        <div className="text-base font-extrabold text-white leading-relaxed">
                          {currentMatch.result_text}
                        </div>
                      </div>

                      {currentMatch.notes && (
                        <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs text-amber-900 mb-2">
                          Note : {currentMatch.notes}
                        </div>
                      )}

                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                        <span>{selectedArticle} • Cyl: {selectedCyl} • Sph: {selectedSphere}</span>
                        <button onClick={() => setView('settings')} className="text-sky-600 font-bold hover:underline">
                          Modifier dans paramètres
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-white rounded-2xl p-5 border border-amber-300 shadow-sm text-center">
                      <div className="text-amber-800 font-bold text-sm mb-1">Aucun résultat enregistré pour cette combinaison</div>
                      <div className="text-xs text-slate-500 mb-4">
                        La combinaison ({selectedArticle} | Cyl: {selectedCyl} | Sphère: {selectedSphere}) n'a pas encore de résultat assigné.
                      </div>
                      <button
                        onClick={() => {
                          setMapArticle(selectedArticle);
                          setMapCyl(selectedCyl);
                          setMapSphere(selectedSphere);
                          setSettingsTab('results');
                          setView('settings');
                        }}
                        className="bg-amber-500 text-white font-bold text-xs py-2.5 px-4 rounded-xl hover:bg-amber-600"
                      >
                        Ajouter la phrase de résultat
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          ) : (
            /* VIEW 2: SETTINGS SCREEN */
            <div className="flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
              
              {/* Settings Tabs */}
              <div className="flex bg-white rounded-xl p-1 border border-slate-200">
                <button
                  onClick={() => setSettingsTab('options')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${settingsTab === 'options' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600'}`}
                >
                  Options des Critères (3)
                </button>
                <button
                  onClick={() => setSettingsTab('results')}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${settingsTab === 'results' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600'}`}
                >
                  Phrases de Résultat
                </button>
              </div>

              {settingsTab === 'options' ? (
                <div className="space-y-4">
                  {/* Sub-tabs */}
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => setSelectedCriteria('article')} className={`p-2 rounded-xl text-xs font-bold border ${selectedCriteria === 'article' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-200'}`}>
                      1. Article ({articles.length})
                    </button>
                    <button onClick={() => setSelectedCriteria('cyl')} className={`p-2 rounded-xl text-xs font-bold border ${selectedCriteria === 'cyl' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-200'}`}>
                      2. Cyl ({cyls.length})
                    </button>
                    <button onClick={() => setSelectedCriteria('sphere_minus')} className={`p-2 rounded-xl text-xs font-bold border ${selectedCriteria === 'sphere_minus' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}>
                      3. Sphère (-) ({negSpheres.length})
                    </button>
                    <button onClick={() => setSelectedCriteria('sphere_plus')} className={`p-2 rounded-xl text-xs font-bold border ${selectedCriteria === 'sphere_plus' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-200'}`}>
                      3. Sphère (+) ({posSpheres.length})
                    </button>
                  </div>

                  {/* Add Input */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                    <div className="text-xs font-bold text-slate-700">Ajouter un élément au critère sélectionné :</div>
                    <div className="flex space-x-2">
                      <input
                        type="text"
                        value={newOptionInput}
                        onChange={(e) => setNewOptionInput(e.target.value)}
                        placeholder="Ex: HOYA Hilux 1.50 Hard, 0.75, -1.00..."
                        className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold outline-none focus:border-sky-500"
                      />
                      <button onClick={handleAddOption} className="bg-sky-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-sky-700">
                        Ajouter
                      </button>
                    </div>
                  </div>

                  {/* List */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                    <div className="text-xs font-bold text-slate-700 mb-2">Éléments enregistrés :</div>
                    <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
                      {getCurrentList().map((item, idx) => (
                        <div key={idx} className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between">
                          <span className="text-sm font-bold text-slate-800">{item}</span>
                          <button onClick={() => handleDeleteOption(item)} className="text-rose-600 hover:text-rose-800 p-1">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              ) : (
                /* Results Management Tab */
                <div className="space-y-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div className="text-xs font-bold text-slate-800">Associer une combinaison à un résultat :</div>
                    
                    {/* Pick Article */}
                    <div>
                      <div className="text-[11px] font-bold text-slate-500 mb-1">1. Article :</div>
                      <select value={mapArticle} onChange={e => setMapArticle(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold">
                        <option value="">Sélectionner un article...</option>
                        {articles.map((a, i) => <option key={i} value={a}>{a}</option>)}
                      </select>
                    </div>

                    {/* Pick Cyl */}
                    <div>
                      <div className="text-[11px] font-bold text-slate-500 mb-1">2. Cylindre (Cyl) :</div>
                      <select value={mapCyl} onChange={e => setMapCyl(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold">
                        <option value="">Sélectionner Cyl...</option>
                        {cyls.map((c, i) => <option key={i} value={c}>{c}</option>)}
                      </select>
                    </div>

                    {/* Pick Sphere */}
                    <div>
                      <div className="text-[11px] font-bold text-slate-500 mb-1">3. Sphère :</div>
                      <select value={mapSphere} onChange={e => setMapSphere(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold">
                        <option value="">Sélectionner Sphère...</option>
                        <optgroup label="Négatif (-)">
                          {negSpheres.map((s, i) => <option key={`n-${i}`} value={s}>{s}</option>)}
                        </optgroup>
                        <optgroup label="Positif (+)">
                          {posSpheres.map((s, i) => <option key={`p-${i}`} value={s}>{s}</option>)}
                        </optgroup>
                      </select>
                    </div>

                    {/* Result sentence input */}
                    <div>
                      <div className="text-[11px] font-bold text-slate-700 mb-1">Phrase de résultat direct (Emplacement, rangée, etc.) : *</div>
                      <textarea
                        value={mapResultText}
                        onChange={e => setMapResultText(e.target.value)}
                        placeholder="Ex: DÉPOT HOYA: Rangée B-04 / Casier 12 - Disponible 8 pièces"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium h-20 outline-none"
                      />
                    </div>

                    <div>
                      <div className="text-[11px] font-bold text-slate-500 mb-1">Note supplémentaire (Optionnel) :</div>
                      <input
                        type="text"
                        value={mapNotes}
                        onChange={e => setMapNotes(e.target.value)}
                        placeholder="Ex: Traitement HVLL"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                      />
                    </div>

                    <button onClick={handleSaveResult} className="w-full py-3 bg-sky-600 text-white rounded-xl text-xs font-bold hover:bg-sky-700">
                      Enregistrer le résultat
                    </button>
                  </div>

                  {/* Configured Results List */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                    <div className="text-xs font-bold text-slate-700 mb-2">Résultats configurés ({results.length}) :</div>
                    <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                      {results.map((res, i) => (
                        <div key={i} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
                          <div className="flex items-center justify-between">
                            <div className="flex flex-wrap gap-1">
                              <span className="text-[10px] font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded">{res.article}</span>
                              <span className="text-[10px] font-bold bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded">Cyl: {res.cyl}</span>
                              <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded">Sph: {res.sphere}</span>
                            </div>
                            <button onClick={() => handleDeleteResult(res)} className="text-rose-600 hover:text-rose-800 p-1">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                          </div>
                          <div className="text-xs font-semibold text-slate-800">{res.result_text}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* MODAL 1: ARTICLE (Vertical Picker) */}
          {modalArticleOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0" onClick={() => setModalArticleOpen(false)}>
              <div className="w-full max-w-md bg-white rounded-t-3xl p-5 max-h-[75vh] flex flex-col" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <span className="font-bold text-slate-900 text-sm">Sélectionner un Article</span>
                  <button onClick={() => setModalArticleOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="overflow-y-auto my-3 space-y-2">
                  {articles.map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setSelectedArticle(item); setModalArticleOpen(false); }}
                      className={`w-full p-3.5 rounded-xl border text-left text-sm font-bold flex items-center justify-between ${selectedArticle === item ? 'bg-sky-50 border-sky-500 text-sky-800' : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'}`}
                    >
                      <span>{item}</span>
                      {selectedArticle === item && <span className="text-sky-600">✓</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: CYL (Vertical Picker) */}
          {modalCylOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0" onClick={() => setModalCylOpen(false)}>
              <div className="w-full max-w-md bg-white rounded-t-3xl p-5 max-h-[75vh] flex flex-col" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <span className="font-bold text-slate-900 text-sm">Sélectionner la valeur Cylindre (Cyl)</span>
                  <button onClick={() => setModalCylOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="overflow-y-auto my-3 space-y-2">
                  {cyls.map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setSelectedCyl(item); setModalCylOpen(false); }}
                      className={`w-full p-3.5 rounded-xl border text-left text-sm font-bold flex items-center justify-between ${selectedCyl === item ? 'bg-sky-50 border-sky-500 text-sky-800' : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'}`}
                    >
                      <span>Cyl: {item}</span>
                      {selectedCyl === item && <span className="text-sky-600">✓</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: SPHERE (Vertical Picker with + and - tabs) */}
          {modalSphereOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0" onClick={() => setModalSphereOpen(false)}>
              <div className="w-full max-w-md bg-white rounded-t-3xl p-5 max-h-[75vh] flex flex-col" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <span className="font-bold text-slate-900 text-sm">Sélectionner la valeur Sphère</span>
                  <button onClick={() => setModalSphereOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                {/* + and - switch */}
                <div className="flex bg-slate-100 p-1 rounded-xl my-3 border border-slate-200">
                  <button
                    onClick={() => setSphereSignTab('-')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${sphereSignTab === '-' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600'}`}
                  >
                    Valeurs Négatives ( - )
                  </button>
                  <button
                    onClick={() => setSphereSignTab('+')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${sphereSignTab === '+' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600'}`}
                  >
                    Valeurs Positives ( + )
                  </button>
                </div>

                <div className="overflow-y-auto my-1 space-y-2">
                  {(sphereSignTab === '-' ? negSpheres : posSpheres).map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setSelectedSphere(item); setModalSphereOpen(false); }}
                      className={`w-full p-3.5 rounded-xl border text-left text-sm font-bold flex items-center justify-between ${selectedSphere === item ? (sphereSignTab === '-' ? 'bg-indigo-50 border-indigo-500 text-indigo-800' : 'bg-emerald-50 border-emerald-500 text-emerald-800') : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'}`}
                    >
                      <span>Sphère: {item}</span>
                      {selectedSphere === item && <span>✓</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
